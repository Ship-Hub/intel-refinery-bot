name: Deploy Intel Refinery Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: intel-refinery-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test
        run: |
          npm ci
          npm test

      - name: Package release
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*.log' \
            -czf intel-refinery-bot-release.tgz \
            src test deploy package.json package-lock.json README.md ecosystem.config.cjs

      - name: Upload release bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT }}
          source: intel-refinery-bot-release.tgz
          target: /tmp

      - name: Activate bot release
        uses: appleboy/ssh-action@v1.0.3
        env:
          BOT_ENV_FILE: ${{ secrets.BOT_ENV_FILE }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT }}
          envs: BOT_ENV_FILE
          script: |
            set -euo pipefail

            APP_DIR=/var/www/intel-refinery-bot
            RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"
            SHARED_DIR="$APP_DIR/shared"

            mkdir -p "$RELEASE_DIR" "$SHARED_DIR"
            tar -xzf /tmp/intel-refinery-bot-release.tgz -C "$RELEASE_DIR"

            if [ -n "${BOT_ENV_FILE:-}" ]; then
              printf '%s\n' "$BOT_ENV_FILE" > "$SHARED_DIR/bot.env"
              chmod 600 "$SHARED_DIR/bot.env"
            fi

            if [ -f "$SHARED_DIR/bot.env" ]; then
              cp "$SHARED_DIR/bot.env" "$RELEASE_DIR/.env"
            else
              cp "$RELEASE_DIR/.env.example" "$RELEASE_DIR/.env"
            fi

            API_ENV_FILE_ON_SERVER=/var/www/intel-refinery/shared/api.env
            if [ -f "$API_ENV_FILE_ON_SERVER" ]; then
              PLATFORM_ADMIN_TOKEN="$(grep -E '^PLATFORM_ADMIN_TOKEN=' "$API_ENV_FILE_ON_SERVER" | tail -1 | cut -d= -f2- | sed 's/\r$//')"
              if [ -n "$PLATFORM_ADMIN_TOKEN" ]; then
                if grep -q '^BACKEND_ADMIN_TOKEN=' "$RELEASE_DIR/.env"; then
                  sed -i "s|^BACKEND_ADMIN_TOKEN=.*|BACKEND_ADMIN_TOKEN=$PLATFORM_ADMIN_TOKEN|" "$RELEASE_DIR/.env"
                else
                  printf '\nBACKEND_ADMIN_TOKEN=%s\n' "$PLATFORM_ADMIN_TOKEN" >> "$RELEASE_DIR/.env"
                fi
                cp "$RELEASE_DIR/.env" "$SHARED_DIR/bot.env"
                chmod 600 "$SHARED_DIR/bot.env"
              fi
            fi

            cd "$RELEASE_DIR"
            npm ci --omit=dev
            node deploy/seedBackendApiKey.cjs

            ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete intel-engine-bot || true
              pm2 delete intel-refinery-bot || true
              pm2 start ecosystem.config.cjs --update-env
              pm2 save
            else
              npm install -g pm2
              pm2 start ecosystem.config.cjs --update-env
              pm2 save
            fi
